name: Tests vidéo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video-tests:
    runs-on: ubuntu-latest
    # Les tests navigateur demandent à eux seuls ~8 min en local, davantage ici
    # (un seul worker, machine partagée). Avec le budget de 10 min, le job était
    # tué en plein milieu de cette étape et finissait « cancelled » : l'interface
    # n'était plus testée du tout, sans que rien ne le signale.
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test-video.txt

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Installer ffmpeg et ffprobe
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Installer les dépendances Python
        run: python -m pip install --upgrade pip -r requirements-test-video.txt

      - name: Exécuter la matrice vidéo
        run: python run_video_tests.py

      - name: Installer Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Tester l'interface et l'export navigateur
        run: npm run test:e2e

      # Sans cela, un échec ne laisse aucune trace consultable : les journaux
      # d'exécution demandent une authentification, et le rapport Playwright
      # (captures, traces, contexte d'erreur) disparaît avec la machine.
      - name: Conserver le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: |
            output/playwright-report
            output/playwright
          retention-days: 7
          if-no-files-found: ignore
