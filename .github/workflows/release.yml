name: Release Windows

# Publier une version :
#   1. mettre à jour __version__ dans version.py, committer ;
#   2. git tag v1.2.0 && git push origin v1.2.0
# Le workflow construit l'installeur et la version portable, puis crée la
# Release GitHub correspondante. Lancé à la main (workflow_dispatch), il
# construit seulement, sans publier : les fichiers sont dans les artefacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Lire la version
        id: version
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content -Raw version.py), '__version__\s*=\s*"([^"]+)"').Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Le tag $env:GITHUB_REF_NAME ne correspond pas à version.py ($version)"
          }

      - name: Tests unitaires
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -t .

      - name: Installer Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Construire l'exécutable et l'installeur
        shell: pwsh
        run: ./installer/build.ps1

      - name: Archive portable
        shell: pwsh
        run: Compress-Archive -Path dist/MyGCFlow -DestinationPath "dist/MyGCFlow-${{ steps.version.outputs.version }}-portable.zip"

      - name: Vérifier que l'exécutable démarre
        shell: pwsh
        run: |
          $env:MYGCFLOW_DATA_DIR = "$env:RUNNER_TEMP\mygcflow-data"
          $env:MYGCFLOW_CONFIG_DIR = "$env:RUNNER_TEMP\mygcflow-config"
          $process = Start-Process -FilePath dist/MyGCFlow/MyGCFlow.exe -ArgumentList '--no-browser', '--no-tray' -PassThru
          $ok = $false
          foreach ($i in 1..60) {
            try { $ping = Invoke-RestMethod http://127.0.0.1:51730/api/ping -TimeoutSec 2; $ok = $true; break }
            catch { Start-Sleep -Milliseconds 500 }
          }
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content "$env:MYGCFLOW_DATA_DIR\logs\mygcflow.log" -ErrorAction SilentlyContinue; throw 'MyGCFlow.exe ne répond pas' }
          "MyGCFlow $($ping.version) a démarré"

      - name: Conserver les fichiers construits
        uses: actions/upload-artifact@v4
        with:
          name: MyGCFlow-${{ steps.version.outputs.version }}-windows
          path: |
            dist/MyGCFlow-Setup-*.exe
            dist/MyGCFlow-*-portable.zip

      - name: Publier la Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Le corps de la Release devient le changelog affiché dans
          # l'application (options.py le lit) : il doit être lisible par un
          # utilisateur. On préfère donc des notes écrites à la main quand
          # docs/release_notes/<version>.md existe, et on ne retombe sur les
          # titres de commits que par défaut.
          $notes = "docs/release_notes/${{ steps.version.outputs.version }}.md"
          if (Test-Path $notes) {
            $notesArgs = @('--notes-file', $notes)
            Write-Host "Notes de Release : $notes"
          } else {
            $notesArgs = @('--generate-notes')
            Write-Warning "Aucune note écrite pour ${{ steps.version.outputs.version }} : repli sur les titres de commits."
          }
          gh release create "$env:GITHUB_REF_NAME" `
            (Get-ChildItem dist/MyGCFlow-Setup-*.exe).FullName `
            (Get-ChildItem dist/MyGCFlow-*-portable.zip).FullName `
            --title "MyGCFlow ${{ steps.version.outputs.version }}" `
            @notesArgs
