[python: **.py]
[jinja2: **.html]
# Les chaînes JS traduisibles passent par pkg.t('...') / t('...') (cf.
# notifications.js), d'où le mot-clé `t` à passer à l'extraction :
#   pybabel extract -F babel.cfg -k _ -k _l -k t -o messages.pot .
# Motif à un seul niveau : static/js/vendor/ (bibliothèques tierces) est exclu.
[javascript: static/js/*.js]
[javascript: static/js/*.mjs]
