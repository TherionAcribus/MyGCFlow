[python: **.py]
[jinja2: **.html]
# Les chaînes JS traduisibles passent par pkg.t('...') / t('...') (cf.
# notifications.js), et les chaînes Python hors requête par _tr('...')
# (settings_manager.py, task_manager.py), d'où les mots-clés à passer :
#   pybabel extract -F babel.cfg -k _ -k _l -k t -k _tr -o messages.pot .
# Motif à un seul niveau : static/js/vendor/ (bibliothèques tierces) est exclu.
[javascript: static/js/*.js]
[javascript: static/js/*.mjs]
