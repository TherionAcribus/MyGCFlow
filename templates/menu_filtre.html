<section id="filterPanel">
    <!-- Barre d'actions : reset global. Secondaire au repos ; data-filters-active
         sur #filterPanel (posé par bdd.js quand un filtre sort de l'état neutre)
         le repasse en rouge via ui_improvements.css. -->
    <div class="d-flex justify-content-end mb-2">
        <button type="button" id="btnResetAllFilters" class="btn btn-sm btn-outline-secondary">
            <i class="ti ti-refresh me-1"></i>{{ _("Réinitialiser tous les filtres") }}
        </button>
    </div>

    <!-- Lignes Type / Taille / Difficultés / Terrain (partagées avec le mode Évolution) -->
    {% include '_filter_cache_attrs.html' %}

    <!-- Ligne 3 : Période de découverte (dates) -->
    <div class="row g-2">
        <div class="col-12 mb-1">
            <span class="form-label text-muted mb-0">{{ _("Période de découverte") }}</span>
        </div>
        <div class="mb-3 col-6">
            <label for="datePickerStart" class="form-label">{{ _("Date de début") }}</label>
            <input id="datePickerStart" type="text" class="form-control td-input" aria-label="{{ _('Date de début') }}">
            <div class="date-source-row mt-2">
                <button type="button" id="btnResetStartDate" class="date-source-btn" data-bs-toggle="tooltip" data-bs-title="{{ _('Date par défaut (toutes les données)') }}">
                    <i class="ti ti-database" aria-hidden="true"></i><span class="date-source-label">{{ _("Données") }}</span><span class="date-source-separator" aria-hidden="true">·</span><span class="date-source-value">—</span><i class="ti ti-check date-source-check" aria-hidden="true"></i>
                </button>
            </div>
        </div>
        <div class="mb-3 col-6">
            <label for="datePickerEnd" class="form-label">{{ _("Date de fin") }}</label>
            <input id="datePickerEnd" type="text" class="form-control td-input" aria-label="{{ _('Date de fin') }}">
            <div class="date-source-row mt-2">
                <button type="button" id="btnResetEndDate" class="date-source-btn" data-bs-toggle="tooltip" data-bs-title="{{ _('Date par défaut (toutes les données)') }}">
                    <i class="ti ti-database" aria-hidden="true"></i><span class="date-source-label">{{ _("Données") }}</span><span class="date-source-separator" aria-hidden="true">·</span><span class="date-source-value">—</span><i class="ti ti-check date-source-check" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Ligne 4 : Période de pose -->
    <div class="row g-2">
        <div class="col-12 mb-1">
            <span class="form-label text-muted mb-0">{{ _("Période de pose") }}</span>
        </div>
        <div class="mb-3 col-6">
            <label for="publishedDatePickerStart" class="form-label">{{ _("Date de début") }}</label>
            <input id="publishedDatePickerStart" type="text" class="form-control td-input" aria-label="{{ _('Date de début') }}">
            <div class="date-source-row mt-2">
                <button type="button" id="btnResetPublishedStartDate" class="date-source-btn" data-bs-toggle="tooltip" data-bs-title="{{ _('Date par défaut (toutes les données)') }}">
                    <i class="ti ti-database" aria-hidden="true"></i><span class="date-source-label">{{ _("Données") }}</span><span class="date-source-separator" aria-hidden="true">·</span><span class="date-source-value">—</span><i class="ti ti-check date-source-check" aria-hidden="true"></i>
                </button>
            </div>
        </div>
        <div class="mb-3 col-6">
            <label for="publishedDatePickerEnd" class="form-label">{{ _("Date de fin") }}</label>
            <input id="publishedDatePickerEnd" type="text" class="form-control td-input" aria-label="{{ _('Date de fin') }}">
            <div class="date-source-row mt-2">
                <button type="button" id="btnResetPublishedEndDate" class="date-source-btn" data-bs-toggle="tooltip" data-bs-title="{{ _('Date par défaut (toutes les données)') }}">
                    <i class="ti ti-database" aria-hidden="true"></i><span class="date-source-label">{{ _("Données") }}</span><span class="date-source-separator" aria-hidden="true">·</span><span class="date-source-value">—</span><i class="ti ti-check date-source-check" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Ligne 5 : Pays et Régions/États -->
    {% include '_filter_country_state.html' %}

    <!-- Caches « locationless » (ex. GC9FAVE) : leur position dans le GPX est
         fictive — affichée, elle planterait un point (et un trajet) là où
         l'utilisateur n'est jamais allé. Ce n'est pas un filtre (elles restent
         comptées) mais un choix d'affichage, d'où le <hr> qui le distingue des
         lignes de sélection ; pas de classe filter-select non plus : il ne doit
         ni entrer dans getSelectedFilters ni marquer le panneau « filtre
         actif ». Préférence globale persistée dans settings.json. Absent de la
         page Évolution : menu_data_evolution.html n'inclut pas ce gabarit. -->
    <hr class="my-2">
    <div class="row g-2">
        <div class="mb-1 col-12 col-md-6" id="locationlessDisplayField">
            <label class="form-label" for="selectLocationlessDisplay">{{ _("Caches sans localisation (locationless)") }}</label>
            <select id="selectLocationlessDisplay" class="form-select" aria-label="{{ _('Caches sans localisation (locationless)') }}">
                <option value="hidden">{{ _("Comptées, sans point sur la carte") }}</option>
                <option value="shown">{{ _("Comptées et affichées sur la carte") }}</option>
            </select>
            <p class="form-hint text-muted mb-0">
                {{ _("Leur position dans le fichier est fictive : affichée, elle trace un point là où vous n'êtes pas allé.") }}
            </p>
        </div>
    </div>
</section>
