<!-- Onglet Données : Base de données et filtres -->
<div id="data" class="col s12">
    <div class="row">
        <!-- Section Base de données -->
        <div class="col s12 m6">
            <h5>📊 Base de données</h5>
            <div class="card-panel blue-grey lighten-5">
                <form id="uploadBddForm">
                    <div class="file-field input-field">
                        <div class="btn blue waves-effect waves-light">
                            <span>📁 Choisir fichier</span>
                            <input type="file" id="file-input" name="file" accept=".gpx" />
                        </div>
                        <div class="file-path-wrapper">
                            <input class="file-path validate" type="text" placeholder="Sélectionnez un fichier .gpx de vos trouvailles">
                        </div>
                    </div>
                    <button type="submit" class="btn waves-effect waves-light blue">
                        <i class="material-icons right">cloud_upload</i>📤 Charger données
                    </button>
                </form>
                <div id="infosBDD" class="mt-3 grey-text text-darken-2">
                    <i class="material-icons tiny">info</i> Aucune base de données chargée
                </div>
            </div>
        </div>

        <!-- Section Filtres -->
        <div class="col s12 m6">
            <h5>🔍 Filtres</h5>
            <div class="card-panel blue-grey lighten-5">
                {% include 'menu_filtre.html' %}
            </div>
        </div>
    </div>
</div>
