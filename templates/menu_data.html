<!-- Onglet Données : Base de données et filtres -->
<div id="data" class="col s12">
    <div class="row">
        <!-- Section Base de données -->
        <div class="col s12 m6">
            <h5>{{ _("Base de données") }}</h5>
            <div class="card-panel">
                <form id="uploadBddForm">
                    <div class="file-field input-field">
                        <div class="btn waves-effect waves-light">
                            <span>{{ _("Choisir fichier") }}</span>
                            <input type="file" id="file-input" name="file" accept=".gpx" />
                        </div>
                        <div class="file-path-wrapper">
                            <input class="file-path validate" type="text" placeholder="{{ _("Sélectionnez un fichier .gpx de vos trouvailles") }}">
                        </div>
                    </div>
                    <button type="submit" class="btn waves-effect waves-light">
                        <i class="material-icons right">cloud_upload</i>{{ _("Charger données") }}
                    </button>
                </form>
                <div id="infosBDD" class="mt-3 grey-text text-darken-2">
                    {{ _("Aucune base de données chargée") }}
                </div>
            </div>
        </div>

        <!-- Section Filtres -->
        <div class="col s12 m6">
            <h5>{{ _("Filtres") }}</h5>
            <div class="card-panel">
                {% include 'menu_filtre.html' %}
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col s12 right-align">
            <div id="filtersCounter" class="filters-counter grey-text text-darken-2">{{ _("Sélection: 0 / 0") }}</div>
        </div>
    </div>
</div>
