<!-- Onglet Données : Base de données et filtres (Tabler/Bootstrap 5) -->
<div id="data" class="col-12 tab-pane fade show active">
    <div class="row g-3">
        <!-- Section Base de données -->
        <div class="col-12 col-lg-4">
            <h5 class="gc-section-title">
                <i class="ti ti-database text-muted me-1"></i>{{ _("Base de données") }}
            </h5>
            <div class="card">
                <div class="card-body">
                    <form id="uploadBddForm">
                        <div class="mb-3">
                            <label for="file-input" class="form-label">{{ _("Sélectionner et charger un fichier .gpx") }}</label>
                            <div class="gpx-dropzone">
                                <input type="file" class="form-control" id="file-input" name="file" accept=".gpx" aria-label="{{ _('Fichier .gpx') }}" />
                                <div class="gpx-dropzone__hint">
                                    <i class="ti ti-drag-drop me-1"></i>{{ _("ou glissez-déposez votre fichier n'importe où sur la page") }}
                                </div>
                            </div>
                        </div>
                    </form>

                    <!-- Bouton pour supprimer la base de données -->
                    <div class="mt-3">
                        <button id="clearDatabaseBtn" class="btn btn-danger w-100" style="display: none;">
                            <i class="ti ti-trash me-1"></i>{{ _("Supprimer la base de données") }}
                        </button>
                    </div>

                    <div id="infosBDD" class="form-hint text-muted mt-3">
                        {{ _("Aucune base de données chargée") }}
                    </div>
                </div>
            </div>
        </div>

        <!-- Section Filtres -->
        <div class="col-12 col-lg-8">
            <h5 class="gc-section-title">
                <i class="ti ti-filter text-muted me-1"></i>{{ _("Filtres") }}
            </h5>
            <div class="card">
                <div class="card-body">
                    {% include 'menu_filtre.html' %}
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-12 text-end">
            <div id="filtersCounter" class="filters-counter text-muted">{{ _("Sélection: 0 / 0") }}</div>
        </div>
    </div>
</div>
