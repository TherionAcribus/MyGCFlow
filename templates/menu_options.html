<div id="settings" class="col-12 tab-pane fade">
    <h5 class="gc-section-title">
        <i class="ti ti-settings text-muted me-1"></i>{{ _("Préférences de l'application") }}
    </h5>
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-2">
                <div class="mb-3 col-12 col-md-6">
                    <label class="form-label" for="selectLanguage">{{ _("Language Choice") }}</label>
                    <select id="selectLanguage" class="form-select" aria-label="{{ _('Langue') }}">
                        <option value="en">{{ _("English") }}</option>
                        <option value="fr">{{ _("Français") }}</option>
                    </select>
                </div>

                <div class="mb-3 col-12 col-md-6">
                    <label class="form-label" for="selectTheme">{{ _("Thème") }}</label>
                    <select id="selectTheme" class="form-select" aria-label="{{ _('Thème de l\'interface') }}">
                        <option value="system">{{ _("Système") }}</option>
                        <option value="light">{{ _("Clair") }}</option>
                        <option value="dark">{{ _("Sombre") }}</option>
                    </select>
                </div>

                <div class="mb-3 col-12 col-md-6">
                    <label class="form-label" for="selectCheckVersionOnline">{{ _("Check for a new version at startup") }}</label>
                    <select id="selectCheckVersionOnline" class="form-select" aria-label="{{ _('Vérifier version au démarrage') }}">
                        <option value="true">{{ _("Yes") }}</option>
                        <option value="false">{{ _("No") }}</option>
                    </select>
                </div>

                <div class="mb-3 col-12 col-md-6">
                    <label class="form-label" for="selectDefaultProfile">{{ _("Default profile at startup") }}</label>
                    <select id="selectDefaultProfile" class="form-select" aria-label="{{ _('Profil par défaut') }}">
                        <!-- Les options seront remplies dynamiquement par JavaScript -->
                    </select>
                </div>

                <div class="col-12">
                    <div class="card mt-2">
                        <div class="card-body">
                            <div class="row g-2 mb-0">
                                <div class="col-12 col-md-1 d-flex justify-content-start align-items-center mt-2">
                                    <button type="button" id="btnToggleLatLonMode" class="btn btn-link p-0" data-bs-toggle="tooltip" data-bs-title="{{ _('Basculer le mode de saisie') }}" aria-label="{{ _('Basculer le mode de saisie') }}">
                                        <i class="ti ti-link"></i>
                                    </button>
                                </div>
                                <div class="col-12 col-md-11">
                                    <div class="row g-2 mb-0">
                                        <div class="mb-3 col-12" id="fieldCombined">
                                            <label for="inputMapCenterCombined" class="form-label">{{ _("Centre de carte par défaut - Lat, Lon") }}</label>
                                            <input id="inputMapCenterCombined" type="text" class="form-control" placeholder="48.85, 2.35">
                                        </div>
                                        <div class="mb-3 col-12 col-md-6 d-none" id="fieldLat">
                                            <label for="inputMapCenterLat" class="form-label">{{ _("Centre de carte par défaut - Latitude") }}</label>
                                            <input id="inputMapCenterLat" type="text" class="form-control">
                                        </div>
                                        <div class="mb-3 col-12 col-md-6 d-none" id="fieldLon">
                                            <label for="inputMapCenterLon" class="form-label">{{ _("Centre de carte par défaut - Longitude") }}</label>
                                            <input id="inputMapCenterLon" type="text" class="form-control">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row g-2 mb-0">
                                <div class="mb-3 col-12 col-md-6">
                                    <label for="inputMapDefaultZoom" class="form-label">{{ _("Zoom de carte par défaut") }}</label>
                                    <input id="inputMapDefaultZoom" type="number" min="0" max="22" class="form-control">
                                </div>
                                <div class="col-12 col-md-6 d-flex gap-2 align-items-center flex-wrap mt-md-3">
                                    <button type="button" id="btnUseCurrentMapCenter" class="btn btn-primary">
                                        <i class="ti ti-current-location me-1"></i>{{ _("Utiliser la vue actuelle de la carte") }}
                                    </button>
                                    <button type="button" id="btnPickMapCenter" class="btn btn-primary">
                                        <i class="ti ti-map-pin me-1"></i>{{ _("Choisir sur la carte") }}
                                    </button>
                                    <button type="button" id="btnClearMapCenter" class="btn btn-secondary">
                                        <i class="ti ti-x me-1"></i>{{ _("Réinitialiser") }}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-6 d-flex gap-2 align-items-center flex-wrap mt-2">
                    <button type="button" id="buttonCheckVersion" class="btn btn-primary">
                        <i class="ti ti-device-desktop-analytics me-1"></i>{{ _("Check for a new version") }}
                    </button>
                    <button type="button" id="buttonHome" class="btn btn-secondary" target="_blank">
                        <i class="ti ti-home me-1"></i>{{ _("Home") }}
                    </button>
                    <a id="buttonGuide" class="btn btn-secondary" href="/guide" target="_blank">
                        <i class="ti ti-help me-1"></i>{{ _("Mode d'emploi") }}
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>
