<!-- Graphisme des points avec UX améliorée -->

<div id="points" class="col s12">
    <div class="row">
        <div class="col s12">
            <h4 class="center-align">
                {{ _("Graphisme des points") }}
            </h4>
        </div>
    </div>

    <!-- Section principale -->
    <div class="row">

        <!-- Configuration générale -->
        <div class="col s12">
            <div class="card">
                <div class="card-content">
                    <span class="card-title">
                        {{ _("Configuration générale") }}
                    </span>

                    <div class="row">
                        <!-- Mode d'affichage -->
                        <div class="col s12">
                            <div class="switch">
                                <label>
                                     Icône
                                    <input id="switchIconeVectoriel" type="checkbox">
                                    <span class="lever"></span>
                                     Vectoriel
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sous-menu Vectoriel -->
    <div id="vectorielOptions" class="point-options">
        <div class="row">
            <!-- Section Centre du point -->
            <div class="col s12 m6">
                <div class="card blue lighten-5">
                    <div class="card-content">
                        <span class="card-title blue-text">
                            {{ _("Centre du point") }}
                        </span>

                        <!-- Taille du centre -->
                        <div class="row">
                            <div class="col s12">
                                <label>
                                    {{ _("Taille du centre") }}
                                </label>
                            </div>
                            <div class="col s6">
                                <p class="range-field">
                                    <input type="range" id="sliderSizePoint" min="1" max="10" />
                                </p>
                            </div>
                            <div class="col s6">
                                <div class="input-field">
                                    <input type="number" id="inputSizePoint" min="1" max="10" />
                                    <label>pixels</label>
                                </div>
                            </div>
                        </div>

                        <!-- Couleur du centre -->
                        <div class="row">
                            <div class="col s12">
                                <label>
                                    {{ _("Couleur du centre") }}
                                </label>
                            </div>

                            <div class="col s12">
                                <p>
                                    <label>
                                        <input class="with-gap" name="fillColorPoint" type="radio" value="gc"/>
                                        <span>
                                            {{ _("Couleurs GC (par type)") }}
                                        </span>
                                    </label>
                                </p>
                                <p>
                                    <label>
                                        <input class="with-gap" name="fillColorPoint" type="radio" value="none"/>
                                        <span>
                                            {{ _("Transparent") }}
                                        </span>
                                    </label>
                                </p>
                                <p>
                                    <label>
                                        <input class="with-gap" name="fillColorPoint" type="radio" value="fix" />
                                        <span>
                                            {{ _("Couleur unique") }}
                                        </span>
                                    </label>
                                </p>
                            </div>

                            <!-- Color Picker Centre -->
                            <div class="col s12">
                                <div class="input-field">
                                    <input type="color" id="pointCenterColor" value="#ffffff">
                                    <label class="active" for="pointCenterColor">
                                        {{ _("Choisir la couleur") }}
                                    </label>
                                </div>
                            </div>
                        </div>
                </div>
            </div>
        </div>

        <!-- Section Forme du point -->
        <div class="col s12 m6">
            <div class="card green lighten-5">
                <div class="card-content">
                    <span class="card-title green-text">
                        {{ _("Forme du point") }}
                    </span>

                    <!-- Choix de la forme -->
                    <div class="row">
                        <div class="col s12">
                            <div class="input-field">
                                <select id="selectShape">
                                    <option value="circle">Cercle</option>
                                    <option value="triangle">Triangle</option>
                                </select>
                                <label>
                                    {{ _("Forme des points") }}
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section Bordure du point -->
            <div class="col s12 m6">
                <div class="card orange lighten-5">
                    <div class="card-content">
                        <span class="card-title orange-text">
                            {{ _("Bordure du point") }}
                        </span>

                        <!-- Taille de la bordure -->
                        <div class="row">
                            <div class="col s12">
                                <label>
                                    {{ _("Épaisseur de la bordure (0 = aucune)") }}
                                </label>
                            </div>
                            <div class="col s6">
                                <p class="range-field">
                                    <input type="range" id="sliderSizeBorder" min="0" max="10" />
                                </p>
                            </div>
                            <div class="col s6">
                                <div class="input-field">
                                    <input type="number" id="inputSizeBorder" min="0" max="10" />
                                    <label>pixels</label>
                                </div>
                            </div>
                        </div>

                        <!-- Couleur de la bordure -->
                        <div class="row">
                            <div class="col s12">
                                <label>
                                    {{ _("Couleur de la bordure") }}
                                </label>
                            </div>

                            <div class="col s12">
                                <p>
                                    <label>
                                        <input class="with-gap" name="borderColorPoint" type="radio" value="gc"/>
                                        <span>
                                            {{ _("Couleurs GC (par type)") }}
                                        </span>
                                    </label>
                                </p>
                                <p>
                                    <label>
                                        <input class="with-gap" name="borderColorPoint" type="radio" value="none"/>
                                        <span>
                                            {{ _("Transparent") }}
                                        </span>
                                    </label>
                                </p>
                                <p>
                                    <label>
                                        <input class="with-gap" name="borderColorPoint" type="radio" value="fix" />
                                        <span>
                                            {{ _("Couleur unique") }}
                                        </span>
                                    </label>
                                </p>
                            </div>

                            <!-- Color Picker Bordure -->
                            <div class="col s12">
                                <div class="input-field">
                                    <input type="color" id="pointBorderColor" value="#000000">
                                    <label class="active" for="pointBorderColor">
                                        {{ _("Choisir la couleur") }}
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sous-menu Icône -->
    <div id="iconeOptions" class="point-options" style="display: none;">
        <div class="row">
            <div class="col s12">
                <div class="card">
                    <div class="card-content">
                        <span class="card-title">
                            {{ _("Configuration des icônes") }}
                        </span>

                        <!-- Choix du jeu d'icônes -->
                        <div class="row">
                            <div class="col s12">
                                <div class="input-field">
                                    <select id="selectIconSet">
                                        <option value="geocaching">Geocaching</option>
                                        <option value="cercle">Cercle</option>
                                        <option value="triangle">Triangle</option>
                                    </select>
                                    <label>
                                        {{ _("Jeu d'icônes") }}
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Taille des icônes -->
                        <div class="row">
                            <div class="col s12">
                                <label>
                                    {{ _("Taille des icônes") }}
                                </label>
                            </div>
                            <div class="col s6">
                                <p class="range-field">
                                    <input type="range" id="sliderSizeIcon" min="12" max="40" />
                                </p>
                            </div>
                            <div class="col s6">
                                <div class="input-field">
                                    <input type="number" id="inputSizeIcon" min="12" max="40" />
                                    <label>pixels</label>
                                </div>
                            </div>
                        </div>

                        <!-- Aperçu des icônes disponibles -->
                        <div class="row">
                            <div class="col s12">
                                <label>
                                    {{ _("Aperçu des icônes") }}
                                </label>
                                <div id="iconPreview" class="icon-grid">
                                    <!-- Les icônes seront générées dynamiquement ici -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
