{% from '_scope_badges.html' import profile_scope_badge with context %}
<div id="flash">
    <h5 class="gc-section-title">
        <i class="ti ti-bolt text-warning me-1"></i>{{ _("Animation du Flash") }}{{ profile_scope_badge() }}
    </h5>
    <form>
        <!-- Select pour choisir la forme du flash (remplace les anciens radio buttons) -->
        <div class="mb-3">
            <label class="form-label" for="selectFlashMode">{{ _("Forme du flash") }}</label>
            <select id="selectFlashMode" class="form-select" aria-label="{{ _('Forme du flash') }}">
                <option value="none">{{ _("Pas de flash") }}</option>
                <option value="circle" selected>{{ _("Cercle") }}</option>
                <option value="impulse">{{ _("Impulsion (halo + onde)") }}</option>
                <option value="implode">{{ _("Implosion (anneau qui se referme)") }}</option>
                <option value="echo">{{ _("Double onde (écho)") }}</option>
                <option value="target">{{ _("Cible (réticule)") }}</option>
                <option value="star">{{ _("Étoile") }}</option>
                <option value="sparkle">{{ _("Scintillement") }}</option>
                <option value="square">{{ _("Carré") }}</option>
                <option value="triangle">{{ _("Triangle") }}</option>
                <option value="diamond">{{ _("Losange") }}</option>
            </select>
        </div>

        <!-- La durée du flash fait partie de son caractère autant que la
             forme : réglage de thème, ici — le rythme (jours/s, dates, temps
             additionnel) reste une préférence globale dans Animation. -->

        <div class="mb-3">
            <label class="form-label" for="inputSizeFlash">{{ _("Taille du flash en px") }}</label>
            <input id="inputSizeFlash" type="number" class="form-control" min="5" max="200" step="5" placeholder="{{ _('Taille du Flash') }}" aria-describedby="helpSizeFlash">
            <small id="helpSizeFlash" class="form-hint text-muted">{{ _("5 à 200 px") }}</small>
        </div>

        <div class="mb-3">
            <label class="form-label" for="inputTimeFlash">{{ _("Durée du flash (ms)") }}</label>
            <input id="inputTimeFlash" type="number" class="form-control" min="100" max="10000" step="100" placeholder="{{ _('Durée du flash') }}" aria-describedby="helpTimeFlash feedbackTimeFlash">
            <small id="helpTimeFlash" class="form-hint text-muted">{{ _("100 à 10 000 ms — un flash sec ou un halo lent : la durée fait partie du style autant que la forme.") }}</small>
            <div class="invalid-feedback" id="feedbackTimeFlash"></div>
        </div>

        <!-- Couleur du flash -->
        <label class="form-label">{{ _("Couleur du flash") }}</label>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="flashColor" id="flashColorGc" value="gc" aria-labelledby="flashColorGcLabel">
            <label class="form-check-label" id="flashColorGcLabel" for="flashColorGc">{{ _("Couleurs GC (par type)") }}</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="flashColor" id="flashColorNone" value="none" aria-labelledby="flashColorNoneLabel">
            <label class="form-check-label" id="flashColorNoneLabel" for="flashColorNone">{{ _("Transparent") }}</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="flashColor" id="flashColorFix" value="fix" checked aria-labelledby="flashColorFixLabel">
            <label class="form-check-label" id="flashColorFixLabel" for="flashColorFix">{{ _("Couleur unique") }}</label>
        </div>

        <!-- Color Picker Flash -->
        <div class="mt-2">
            <label class="form-label" for="flashColor">{{ _("Choisir la couleur") }}</label>
            <input type="color" class="form-control form-control-color" id="flashColor" value="#FF00FF" aria-label="{{ _('Choisir la couleur du flash') }}">
        </div>

        <!-- Contour des formes qui en ont un (étoile, scintillement, carré,
             triangle, losange) : « auto » garde la couleur historique du mode. -->
        <label class="form-label mt-3">{{ _("Couleur du contour") }}</label>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="flashBorderColor" id="flashBorderColorAuto" value="auto" checked aria-labelledby="flashBorderColorAutoLabel">
            <label class="form-check-label" id="flashBorderColorAutoLabel" for="flashBorderColorAuto">{{ _("Automatique") }}</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="flashBorderColor" id="flashBorderColorGc" value="gc" aria-labelledby="flashBorderColorGcLabel">
            <label class="form-check-label" id="flashBorderColorGcLabel" for="flashBorderColorGc">{{ _("Couleurs GC (par type)") }}</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="flashBorderColor" id="flashBorderColorNone" value="none" aria-labelledby="flashBorderColorNoneLabel">
            <label class="form-check-label" id="flashBorderColorNoneLabel" for="flashBorderColorNone">{{ _("Transparent") }}</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="flashBorderColor" id="flashBorderColorFix" value="fix" aria-labelledby="flashBorderColorFixLabel">
            <label class="form-check-label" id="flashBorderColorFixLabel" for="flashBorderColorFix">{{ _("Couleur unique") }}</label>
        </div>
        <div class="mt-2">
            <label class="form-label" for="flashBorderColor">{{ _("Choisir la couleur") }}</label>
            <input type="color" class="form-control form-control-color" id="flashBorderColor" value="#000000" aria-label="{{ _('Choisir la couleur du contour') }}">
        </div>
    </form>
</div>
