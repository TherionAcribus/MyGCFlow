<div id="flash" class="col s12">
    <h3>Animation du Flash</h3>
    <div>
        <form>

            <!-- Select pour choisir la forme du flash (remplace les anciens radio buttons) -->
            <div class="input-field">
                <select id="selectFlashMode">
                    <option value="none">Pas de flash</option>
                    <option value="circle">Cercle</option>
                    <option value="star">Étoile</option>
                    <option value="square">Carré</option>
                    <option value="triangle">Triangle</option>
                    <option value="diamond">Losange</option>
                </select>
                <label for="selectFlashMode">Forme du flash</label>
            </div>

            <div class="input-field">
                <input placeholder="Durée du flash" id="inputTimeFlash" type="number" class="validate">
                <label for="inputTimeFlash">Durée du flash en ms</label>
            </div>

            <div class="input-field">
                <input placeholder="Taille du Flash" id="inputSizeFlash" type="number" class="validate">
                <label for="inputSizeFlash">Taille du flash en ms</label>
            </div>

            <!-- Color Pickers Flash -->
            <div class="input-field col s3">
                <span>Couleur du flash: </span>
                <input type="color" id="flashColor" value="#ffffff">
            </div>

        </form>
    </div>
</div>
