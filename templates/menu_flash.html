<div id="flash" class="col s12">
    <h3>{{ _("Animation du Flash") }}</h3>
    <div>
        <form>

            <!-- Select pour choisir la forme du flash (remplace les anciens radio buttons) -->
            <div class="input-field">
                <select id="selectFlashMode">
                    <option value="none">{{ _("Pas de flash") }}</option>
                    <option value="circle" selected>{{ _("Cercle") }}</option>
                    <option value="star">{{ _("Étoile") }}</option>
                    <option value="square">{{ _("Carré") }}</option>
                    <option value="triangle">{{ _("Triangle") }}</option>
                    <option value="diamond">{{ _("Losange") }}</option>
                </select>
                <label for="selectFlashMode">{{ _("Forme du flash") }}</label>
            </div>

            <div class="input-field">
                <input placeholder="{{ _('Durée du flash') }}" id="inputTimeFlash" type="number" class="validate" min="100" max="10000" step="100">
                <label for="inputTimeFlash">{{ _("Durée du flash en ms") }}</label>
            </div>

            <div class="input-field">
                <input placeholder="{{ _('Taille du Flash') }}" id="inputSizeFlash" type="number" class="validate" min="5" max="200" step="5">
                <label for="inputSizeFlash">{{ _("Taille du flash en px") }}</label>
            </div>

            <!-- Color Pickers Flash -->
            <div class="input-field col s3">
                <span>{{ _("Couleur du flash") }}: </span>
                <input type="color" id="flashColor" value="#FF00FF">
            </div>

        </form>
    </div>
</div>
