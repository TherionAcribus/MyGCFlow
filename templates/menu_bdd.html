<!-- Tabs pour la base de données -->
<div id="bdd" class="col s12">
    <div class="row">
        <div class="col s12">
            <ul class="tabs">
                <li class="tab col s3"><a class="active" href="#chargement">{{ _("Chargement") }}</a></li>
                <li class="tab col s3"><a href="#bddd">{{ _("Options de la base de données") }}</a></li>
                <li class="tab col s3"><a href="#filtre">{{ _("Filtres") }}</a></li>
                <li class="tab col s3"><a href="#contenu">{{ _("Contenu") }}</a></li>
            </ul>
        </div>

        <div id="chargement" class="col s12">
            <div class="card-panel">
                <div class="row">
                    <form class="col s12 m6" id="uploadBddForm">
                        <input type="file" id="file-input" name="file" accept=".gpx" />
                        <button type="submit" class="btn">{{ _("Envoyer") }}</button>
                    </form>
                    <div id="infosBDD" class="col s12 m6">{{ _("Aucune base de données chargée") }}</div>
                </div>
            </div>
        </div>

        <div id="filtre" class="col s12">
            <div class="card-panel">
                {% include 'menu_filtre.html' %}
            </div>
        </div>

        <div id="bddd" class="col s12">
            <div class="card-panel">{{ _("Options à venir") }}</div>
        </div>
        <div id="contenu" class="col s12">
            <div class="card-panel">{{ _("Contenu à venir") }}</div>
        </div>
    </div>
</div>
