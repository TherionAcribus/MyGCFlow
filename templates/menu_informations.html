<!-- Informations à afficher -->
<div id="infos">
    <div id="gcCssAssistant" class="gc-css-assistant editor-simple">
        <!-- Toggle Simple / Avancé : préférence d'interface mémorisée en
             localStorage (infosEditorMode) par infos_editor.js. En mode simple,
             les champs marqués .infos-advanced sont masqués par CSS — ils
             restent dans le DOM pour que les handlers de l'assistant continuent
             de les lire. -->
        <div class="infos-editor-mode d-flex align-items-center justify-content-between gap-2 mb-2">
            <span class="form-label mb-0">{{ _('Réglages') }}</span>
            <div class="btn-group btn-group-sm" role="group" aria-label="{{ _('Mode de réglage') }}">
                <button type="button" id="infosModeSimple" class="btn active" aria-pressed="true">{{ _('Simple') }}</button>
                <button type="button" id="infosModeAdvanced" class="btn" aria-pressed="false">{{ _('Avancé') }}</button>
            </div>
        </div>

        <!-- Onglets de cible Titre/Infos + toggle CSS avancé -->
        <div class="gc-css-assistant-header mb-2">
            <div class="gc-css-target-header d-flex flex-wrap align-items-end justify-content-between gap-2">
                <ul class="nav nav-tabs nav-tabs-sm gc-css-target-tabs" role="tablist" aria-label="{{ _('Cible du style') }}">
                    <li class="nav-item" role="presentation">
                        <button type="button" id="gcCssTargetTitle" class="nav-link active" role="tab" aria-selected="true" aria-controls="gcInfosPanelTitle">{{ _("Titre") }}</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button type="button" id="gcCssTargetInfos" class="nav-link" role="tab" aria-selected="false" aria-controls="gcInfosPanelInfos" tabindex="-1">{{ _("Infos") }}</button>
                    </li>
                </ul>
                <div class="gc-css-status infos-advanced d-flex align-items-center gap-2">
                    <span id="gcCssUnmanagedBadge" class="gc-css-unmanaged" tabindex="0" aria-label="{{ _('Certaines propriétés CSS du fichier ne sont pas gérées par les champs ci-dessous. Utilisez le mode CSS avancé pour les éditer manuellement.') }}" data-bs-toggle="tooltip" data-bs-title="{{ _('Certaines propriétés CSS du fichier ne sont pas gérées par les champs ci-dessous. Utilisez le mode CSS avancé pour les éditer manuellement.') }}">?</span>
                    <div class="form-check form-switch m-0">
                        <input class="form-check-input" type="checkbox" id="gcCssAdvancedMode" role="switch">
                        <label class="form-check-label" for="gcCssAdvancedMode">{{ _("CSS") }}</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Panneau Titre -->
        <div id="gcInfosPanelTitle" class="gc-infos-panel mb-2" role="tabpanel" aria-labelledby="gcCssTargetTitle">
            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="cbDisplayTitle">
                <label class="form-check-label" for="cbDisplayTitle">{{ _("Afficher un titre") }}</label>
            </div>
            <div class="mb-2">
                <label class="form-label" for="inputTitle">{{ _("Titre") }}</label>
                <input id="inputTitle" type="text" class="form-control" maxlength="500" placeholder="{{ _('Titre') }}">
            </div>
        </div>

        <!-- Panneau Infos -->
        <div id="gcInfosPanelInfos" class="gc-infos-panel mb-2" role="tabpanel" aria-labelledby="gcCssTargetInfos" hidden>
            {% if mode == 'evolution' %}
            <div class="mb-1">
                <label class="form-label" for="inputInfosTemplate">{{ _("Ligne d'informations") }}</label>
                <input id="inputInfosTemplate" type="text" class="form-control" maxlength="200" autocomplete="off" placeholder="{date} · {actives}">
                <div class="d-flex flex-wrap gap-1 mt-1" role="group" aria-label="{{ _('Insérer une balise') }}">
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-evolution-info-tag="date">{{ _("Date") }}</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-evolution-info-tag="actives">{{ _("Actives") }}</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-evolution-info-tag="placees">{{ _("Placées") }}</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-evolution-info-tag="archivees">{{ _("Archivées") }}</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-evolution-info-tag="total">{{ _("Total") }}</button>
                </div>
                <div class="form-text">{{ _("Balises remplacées en direct : {date}, {actives}, {placees}, {archivees}, {total}. Le reste du texte est affiché tel quel ; un champ vide masque la ligne.") }}</div>
            </div>
            {% else %}
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="cbDisplayNumberofCaches">
                <label class="form-check-label" for="cbDisplayNumberofCaches">{{ _("Afficher le nombre de caches trouvées") }}</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="cbDisplayCurrentDate">
                <label class="form-check-label" for="cbDisplayCurrentDate">{{ _("Afficher la date") }}</label>
            </div>
            {% endif %}
        </div>

        <!-- Onglets CSS : pattern d'onglets accessible (roving tabindex),
             identique aux onglets de cible Titre/Infos ci-dessus. Seul
             l'onglet actif est dans l'ordre de tabulation ; les flèches
             déplacent le focus et activent (cf. initCssAssistant dans ui.js). -->
        <ul class="nav nav-tabs nav-tabs-sm gc-css-tabs" role="tablist">
            <li class="nav-item"><button type="button" id="gcCssTabText" class="nav-link gc-css-tab active" data-pane="gcCssPaneText" role="tab" aria-selected="true" aria-controls="gcCssPaneText">{{ _("Texte") }}</button></li>
            <li class="nav-item"><button type="button" id="gcCssTabBox" class="nav-link gc-css-tab" data-pane="gcCssPaneBox" role="tab" aria-selected="false" aria-controls="gcCssPaneBox" tabindex="-1">{{ _("Boîte") }}</button></li>
            <li class="nav-item"><button type="button" id="gcCssTabShadow" class="nav-link gc-css-tab" data-pane="gcCssPaneShadow" role="tab" aria-selected="false" aria-controls="gcCssPaneShadow" tabindex="-1">{{ _("Ombre") }}</button></li>
            <li class="nav-item"><button type="button" id="gcCssTabPosition" class="nav-link gc-css-tab" data-pane="gcCssPanePosition" role="tab" aria-selected="false" aria-controls="gcCssPanePosition" tabindex="-1">{{ _("Position") }}</button></li>
        </ul>

        <!-- Panneau Texte -->
        <div id="gcCssPaneText" class="gc-css-pane active pt-2" role="tabpanel" aria-labelledby="gcCssTabText">
            <div class="row g-2">
                <div class="col-6">
                    <label class="form-label" for="gcCssTextColor">{{ _("Couleur") }}</label>
                    <input id="gcCssTextColor" type="color" class="form-control form-control-color gc-css-color">
                </div>
                <div class="col-6">
                    <label class="form-label" for="gcCssFontSize">{{ _("Taille (px)") }}</label>
                    <input id="gcCssFontSize" type="number" class="form-control" min="6" max="72" step="1" placeholder="16">
                </div>
            </div>
            <div class="row g-2 mt-0">
                <div class="col-6">
                    <label class="form-label" for="gcCssFontFamily">{{ _("Police") }}</label>
                    <select id="gcCssFontFamily" class="form-select">
                        <option value="">{{ _("Défaut") }}</option>
                        <option value="Arial">Arial</option>
                        <option value="Verdana">Verdana</option>
                        <option value="Trebuchet MS">Trebuchet</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Courier New">Courier</option>
                        <option value="sans-serif">sans-serif</option>
                        <option value="serif">serif</option>
                        <option value="monospace">monospace</option>
                    </select>
                </div>
                <div class="col-6 infos-advanced">
                    <label class="form-label" for="gcCssFontWeight">{{ _("Épaisseur") }}</label>
                    <select id="gcCssFontWeight" class="form-select">
                        <option value="">{{ _("Défaut") }}</option>
                        <option value="normal">{{ _("Normal") }}</option>
                        <option value="bold">{{ _("Gras") }}</option>
                        <option value="100">100</option>
                        <option value="200">200</option>
                        <option value="300">300</option>
                        <option value="400">400</option>
                        <option value="500">500</option>
                        <option value="600">600</option>
                        <option value="700">700</option>
                        <option value="800">800</option>
                        <option value="900">900</option>
                    </select>
                </div>
            </div>
            <div class="row g-2 mt-0">
                <div class="col-12">
                    <label class="form-label" for="gcCssTextAlign">{{ _("Alignement") }}</label>
                    <select id="gcCssTextAlign" class="form-select">
                        <option value="">{{ _("Défaut") }}</option>
                        <option value="left">{{ _("À gauche") }}</option>
                        <option value="center">{{ _("Centré") }}</option>
                        <option value="right">{{ _("À droite") }}</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Panneau Boîte -->
        <div id="gcCssPaneBox" class="gc-css-pane pt-2" role="tabpanel" aria-labelledby="gcCssTabBox">
            <div class="row g-2">
                <div class="col-6">
                    <label class="form-label" for="gcCssBackgroundColor">{{ _("Fond") }}</label>
                    <input id="gcCssBackgroundColor" type="color" class="form-control form-control-color gc-css-color">
                </div>
                <div class="col-6 infos-advanced">
                    <label class="form-label" for="gcCssPadding">{{ _("Marge intérieure (px)") }}</label>
                    <input id="gcCssPadding" type="number" class="form-control" min="0" max="60" step="1">
                </div>
            </div>
            <div class="row g-2 mt-0">
                <div class="col-6">
                    <label class="form-label" for="gcCssBorderRadius">{{ _("Arrondi (px)") }}</label>
                    <input id="gcCssBorderRadius" type="number" class="form-control" min="0" max="60" step="1">
                </div>
                <div class="col-6 infos-advanced">
                    <label class="form-label" for="gcCssBorderWidth">{{ _("Bordure (px)") }}</label>
                    <input id="gcCssBorderWidth" type="number" class="form-control" min="0" max="20" step="1">
                </div>
            </div>
            <div class="row g-2 mt-0 infos-advanced">
                <div class="col-6">
                    <label class="form-label" for="gcCssBorderStyle">{{ _("Style de bordure") }}</label>
                    <select id="gcCssBorderStyle" class="form-select">
                        <option value="">{{ _("Défaut") }}</option>
                        <option value="none">{{ _("Aucune") }}</option>
                        <option value="solid">{{ _("Pleine") }}</option>
                        <option value="dashed">{{ _("Tirets") }}</option>
                        <option value="dotted">{{ _("Pointillés") }}</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="form-label" for="gcCssBorderColor">{{ _("Couleur") }}</label>
                    <input id="gcCssBorderColor" type="color" class="form-control form-control-color gc-css-color">
                </div>
            </div>
        </div>

        <!-- Panneau Ombre -->
        <div id="gcCssPaneShadow" class="gc-css-pane pt-2" role="tabpanel" aria-labelledby="gcCssTabShadow">
            <!-- Libellé en <span> (et non <label for>) : seul le clic sur la case
                 coche/décoche, pas le clic sur toute la ligne (cf. les radios de
                 couleur dans menu_points.html / menu_flash.html). -->
            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="gcCssBoxShadowEnable" aria-labelledby="gcCssBoxShadowEnableLabel">
                <span class="form-check-label" id="gcCssBoxShadowEnableLabel">{{ _("Activer") }}</span>
            </div>
            <div class="row g-2 infos-advanced">
                <div class="col-3">
                    <label class="form-label" for="gcCssShadowX">{{ _("Décalage X") }}</label>
                    <input id="gcCssShadowX" type="number" class="form-control" step="1">
                </div>
                <div class="col-3">
                    <label class="form-label" for="gcCssShadowY">{{ _("Décalage Y") }}</label>
                    <input id="gcCssShadowY" type="number" class="form-control" step="1">
                </div>
                <div class="col-3">
                    <label class="form-label" for="gcCssShadowBlur">{{ _("Flou") }}</label>
                    <input id="gcCssShadowBlur" type="number" class="form-control" min="0" step="1">
                </div>
                <div class="col-3">
                    <label class="form-label" for="gcCssShadowSpread">{{ _("Étendue") }}</label>
                    <input id="gcCssShadowSpread" type="number" class="form-control" step="1">
                </div>
            </div>
            <div class="row g-2 mt-0">
                <div class="col-12">
                    <label class="form-label" for="gcCssShadowColor">{{ _("Couleur") }}</label>
                    <input id="gcCssShadowColor" type="color" class="form-control form-control-color gc-css-color">
                </div>
            </div>
        </div>

        <!-- Panneau Position -->
        <div id="gcCssPanePosition" class="gc-css-pane pt-2" role="tabpanel" aria-labelledby="gcCssTabPosition">
            <!-- Mode simple : ancrage par coin. Écrit position/top/right/bottom/
                 left dans le même modèle CSS que les champs avancés (cf.
                 infos_editor.js). « Personnalisé » reflète un réglage qui ne
                 correspond à aucun coin — le choisir ne modifie rien. -->
            <div class="row g-2 infos-simple-only">
                <div class="col-12">
                    <label class="form-label" for="gcCssAnchor">{{ _("Emplacement") }}</label>
                    <select id="gcCssAnchor" class="form-select">
                        <option value="">{{ _("Personnalisé") }}</option>
                        <option value="top-left">{{ _("En haut à gauche") }}</option>
                        <option value="top-right">{{ _("En haut à droite") }}</option>
                        <option value="bottom-left">{{ _("En bas à gauche") }}</option>
                        <option value="bottom-right">{{ _("En bas à droite") }}</option>
                    </select>
                </div>
            </div>
            <div class="row g-2 infos-advanced">
                <div class="col-6">
                    <label class="form-label" for="gcCssPosition">{{ _("Type de position") }}</label>
                    <select id="gcCssPosition" class="form-select">
                        <option value="">{{ _("Défaut") }}</option>
                        <option value="relative">{{ _("Relative") }}</option>
                        <option value="absolute">{{ _("Absolue") }}</option>
                        <option value="fixed">{{ _("Fixe") }}</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="form-label" for="gcCssZIndex">z-index</label>
                    <input id="gcCssZIndex" type="number" class="form-control" step="1">
                </div>
            </div>
            <div class="row g-2 mt-0 infos-advanced">
                <div class="col-3">
                    <label class="form-label" for="gcCssTop">{{ _("Haut (px)") }}</label>
                    <input id="gcCssTop" type="number" class="form-control" step="1">
                </div>
                <div class="col-3">
                    <label class="form-label" for="gcCssRight">{{ _("Droite (px)") }}</label>
                    <input id="gcCssRight" type="number" class="form-control" step="1">
                </div>
                <div class="col-3">
                    <label class="form-label" for="gcCssBottom">{{ _("Bas (px)") }}</label>
                    <input id="gcCssBottom" type="number" class="form-control" step="1">
                </div>
                <div class="col-3">
                    <label class="form-label" for="gcCssLeft">{{ _("Gauche (px)") }}</label>
                    <input id="gcCssLeft" type="number" class="form-control" step="1">
                </div>
            </div>
            <div class="row g-2 mt-0">
                <div class="col-12">
                    <label class="form-label" for="gcCssOpacity">{{ _("Opacité") }}</label>
                    <input id="gcCssOpacity" type="number" class="form-control" min="0" max="1" step="0.05" placeholder="1">
                </div>
            </div>
        </div>

        <!-- Éditeur CSS avancé -->
        <div id="gcCssAdvancedPanel" class="mt-2" style="display:none;">
            <textarea id="gcCssRawEditor" class="cssEditor form-control" rows="10" cols="50"></textarea>
        </div>

        <!-- Actions -->
        <div class="d-flex gap-2 mt-3 gc-css-actions">
            <button type="button" id="gcCssCopyToOther" class="btn btn-sm btn-secondary" data-bs-toggle="tooltip" data-bs-title="{{ _('Copier le style de la cible actuelle vers l\'autre cible (Titre → Infos ou inversement)') }}">
                <i class="ti ti-copy me-1"></i>{{ _("Copier vers l'autre") }}
            </button>
            <button type="button" id="gcCssApply" class="btn btn-sm btn-primary">
                <i class="ti ti-check me-1"></i>{{ _("Appliquer") }}
            </button>
        </div>
    </div>

    <!-- Éditeurs CSS bruts cachés. Les valeurs par défaut sont chargées par ui.js
         avant l'application d'un profil afin d'éviter toute course asynchrone. -->
    <div style="display:none;">
        <textarea data-css-url="../static/css/titre.css" id="inputTitleCss" class="cssEditor" rows="30" cols="50"></textarea>
        <button id="btnTitleCss">{{ _("Appliquer les Modifications") }}</button>
        <textarea data-css-url="../static/css/infos.css" id="inputInfosCss" class="cssEditor" rows="30" cols="50"></textarea>
        <button id="btnInfosCss">{{ _("Appliquer les Modifications") }}</button>
    </div>
</div>
